<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cafe Arab | الدردشة</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>

<div class="logo">
☕ Cafe Arab
</div>

<div class="subtitle">
مرحباً بك في المقهى العربي
</div>

</header>

<div class="container">

<div class="card">

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">

<h2 id="userName">👤 المستخدم</h2>

<div style="display:flex;gap:10px;">

<button id="notificationBtn" class="btn" style="width:auto;padding:10px 18px;">
🔔
</button>

<button id="logoutBtn" class="btn" style="width:auto;padding:10px 18px;">
🚪 خروج
</button>

</div>

</div>

<hr>

<div id="messages"

style="
height:420px;
overflow-y:auto;
background:#111;
padding:15px;
border-radius:12px;
margin-bottom:20px;
">

</div>

<div style="display:flex;gap:10px;">

<input

id="messageInput"

class="input"

placeholder="اكتب رسالتك..."

style="margin:0;">

<button

id="sendBtn"

class="btn"

style="width:140px;margin:0;">

📤 إرسال

</button>

</div>

</div>

</div>

<footer>

© 2026 Cafe Arab

</footer>

<script type="module" src="chat.js"></script>

</body>
</html>
