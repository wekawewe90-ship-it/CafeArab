<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cafe Arab | غرفة الدردشة</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<div class="logo">
☕ Cafe Arab
</div>

<div class="subtitle">
غرفة الدردشة العامة
</div>

</header>

<div class="container">

<div class="card">

<div style="display:flex;justify-content:space-between;align-items:center;">

<b>💬 كافيه مصر</b>

<span class="online">🟢 452 متصل</span>

</div>

</div>

<div class="card" id="messages" style="height:350px;overflow-y:auto;">

<div style="margin-bottom:15px;">
<b style="color:#d4af37;">محمد</b><br>
السلام عليكم 👋
</div>

<div style="margin-bottom:15px;">
<b style="color:#d4af37;">سارة</b><br>
وعليكم السلام 😊
</div>

<div style="margin-bottom:15px;">
<b style="color:#d4af37;">أحمد</b><br>
أهلاً بكل الموجودين ☕
</div>

</div>

<div class="card">

<textarea
class="input"
id="messageInput"
rows="3"
placeholder="اكتب رسالتك هنا..."></textarea>

<br><br>

<button class="btn" onclick="sendMessage()">

📨 إرسال

</button>

</div>

<a href="index.html" class="btn">

🏠 الصفحة الرئيسية

</a>

</div>

<footer>

© 2026 Cafe Arab

</footer>

<script src="app.js"></script>

</body>

</html>
